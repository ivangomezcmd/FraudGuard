{% extends "layout.html" %}

{% block title %}
    Registro
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Crear Cuenta</h2>
                    <form action="/register" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input autocomplete="username" class="form-control" autofocus id="username" name="username" placeholder="Nombre de usuario" type="text" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input class="form-control" id="password" name="password" placeholder="Contraseña" type="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmation" class="form-label">Repetir Contraseña</label>
                            <input class="form-control" id="confirmation" name="confirmation" placeholder="Repetir contraseña" type="password" required>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-dark" type="submit">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
